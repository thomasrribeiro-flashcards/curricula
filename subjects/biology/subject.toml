schema_version = 3
subject = "biology"
destination = "whole-field"
deck_granularity = "course"
focus = []

[[decks]]
id = "biology-and-scientific-inquiry"
order = 1
tier = "core"
level = "foundational"
prerequisites = []
recommended_after = []
estimated_chapters = 10
status = "proposed"
description = "Use biology's unifying ideas and elementary evidence reasoning to explain living systems across scales."

[[decks]]
id = "quantitative-foundations-for-biology"
order = 2
tier = "core"
level = "foundational"
prerequisites = []
recommended_after = ["biology-and-scientific-inquiry"]
estimated_chapters = 10
status = "proposed"
description = "Use units, ratios, algebra, logarithms, functions, graphs, probability, and estimation in biological contexts."

[[decks]]
id = "chemistry-for-living-systems"
order = 3
tier = "core"
level = "foundational"
prerequisites = ["quantitative-foundations-for-biology"]
recommended_after = ["biology-and-scientific-inquiry"]
estimated_chapters = 10
status = "proposed"
description = "Reason from atomic interactions, water, pH, concentration, energetics, and macromolecular chemistry to biological behavior."

[[decks]]
id = "biological-data-and-statistical-reasoning"
order = 4
tier = "core"
level = "undergraduate-core"
prerequisites = ["quantitative-foundations-for-biology"]
recommended_after = ["biology-and-scientific-inquiry"]
estimated_chapters = 10
status = "proposed"
description = "Describe variation, quantify uncertainty, choose basic analyses, and make bounded inferences from biological data."

[[decks]]
id = "cell-biology"
order = 5
tier = "core"
level = "undergraduate-core"
prerequisites = ["biology-and-scientific-inquiry", "chemistry-for-living-systems"]
recommended_after = []
estimated_chapters = 12
status = "proposed"
description = "Explain how membranes, compartments, structures, transport, signaling, division, and energy transformations make cells work."

[[decks]]
id = "biochemistry-and-metabolism"
order = 6
tier = "core"
level = "undergraduate-core"
prerequisites = ["cell-biology"]
recommended_after = []
estimated_chapters = 12
status = "proposed"
description = "Connect biomolecular structure, enzymes, thermodynamics, pathways, regulation, and compartmentation to metabolic function."

[[decks]]
id = "genetics-and-inheritance"
order = 7
tier = "core"
level = "undergraduate-core"
prerequisites = ["cell-biology"]
recommended_after = ["biological-data-and-statistical-reasoning"]
estimated_chapters = 10
status = "proposed"
description = "Predict and interpret inheritance using chromosomes, recombination, probability, pedigrees, variation, and gene interactions."

[[decks]]
id = "molecular-biology-and-gene-regulation"
order = 8
tier = "core"
level = "undergraduate-core"
prerequisites = ["biochemistry-and-metabolism", "genetics-and-inheritance"]
recommended_after = []
estimated_chapters = 12
status = "proposed"
description = "Explain genome replication, expression, regulation, mutation, repair, and molecular experiments without treating information flow as a rigid slogan."

[[decks]]
id = "evolution"
order = 9
tier = "core"
level = "undergraduate-core"
prerequisites = ["genetics-and-inheritance"]
recommended_after = ["biochemistry-and-metabolism"]
estimated_chapters = 12
status = "proposed"
description = "Use population processes, selection, drift, gene flow, speciation, phylogeny, and evidence to explain biological change and diversity."

[[decks]]
id = "ecology"
order = 10
tier = "core"
level = "undergraduate-core"
prerequisites = ["biology-and-scientific-inquiry", "quantitative-foundations-for-biology"]
recommended_after = ["evolution", "biological-data-and-statistical-reasoning"]
estimated_chapters = 12
status = "proposed"
description = "Analyze organisms, populations, communities, ecosystems, landscapes, and the biosphere across space and time."

[[decks]]
id = "biodiversity-and-phylogenetics"
order = 11
tier = "core"
level = "undergraduate-core"
prerequisites = ["evolution"]
recommended_after = ["ecology"]
estimated_chapters = 12
status = "proposed"
description = "Interpret the tree of life, organismal diversity, classification, form, life cycles, and natural-history evidence."

[[decks]]
id = "biological-research-practice"
order = 12
tier = "core"
level = "undergraduate-core"
prerequisites = ["biology-and-scientific-inquiry", "biological-data-and-statistical-reasoning"]
recommended_after = ["cell-biology", "ecology"]
estimated_chapters = 10
status = "proposed"
description = "Plan ethical, safe, reproducible laboratory and field investigations; document methods; evaluate literature; and communicate results."

[[decks]]
id = "computational-biology-foundations"
order = 13
tier = "core"
level = "undergraduate-core"
prerequisites = ["quantitative-foundations-for-biology"]
recommended_after = ["biological-data-and-statistical-reasoning"]
estimated_chapters = 10
status = "proposed"
description = "Use a first programming environment, structured biological data, databases, reproducible workflows, and simple simulations."

[[decks]]
id = "microbiology-and-virology"
order = 14
tier = "recommended"
level = "undergraduate-core"
prerequisites = ["molecular-biology-and-gene-regulation"]
recommended_after = ["ecology"]
estimated_chapters = 12
status = "proposed"
description = "Explain microbial and viral diversity, growth, metabolism, genetics, ecology, host interactions, and methods."

[[decks]]
id = "plant-form-and-function"
order = 15
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["biochemistry-and-metabolism"]
recommended_after = ["biodiversity-and-phylogenetics", "ecology"]
estimated_chapters = 10
status = "proposed"
description = "Connect plant anatomy, transport, photosynthesis, nutrition, signaling, development, reproduction, defense, and environmental response."

[[decks]]
id = "comparative-animal-physiology"
order = 16
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["biochemistry-and-metabolism"]
recommended_after = ["biodiversity-and-phylogenetics"]
estimated_chapters = 12
status = "proposed"
description = "Use gradients, mass balance, feedback, structure-function, and comparative evidence to explain integrated animal function."

[[decks]]
id = "developmental-biology"
order = 17
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-and-gene-regulation"]
recommended_after = ["plant-form-and-function", "comparative-animal-physiology"]
estimated_chapters = 10
status = "proposed"
description = "Explain how cells generate form through specification, patterning, morphogenesis, growth, regeneration, and environmental interaction."

[[decks]]
id = "neuroscience"
order = 18
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["comparative-animal-physiology"]
recommended_after = ["molecular-biology-and-gene-regulation"]
estimated_chapters = 12
status = "proposed"
description = "Relate neural signaling, circuits, sensory and motor systems, plasticity, and cognition across levels of organization."

[[decks]]
id = "animal-behavior"
order = 19
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["evolution"]
recommended_after = ["ecology", "neuroscience"]
estimated_chapters = 10
status = "proposed"
description = "Analyze behavior through mechanism, development, function, evolutionary history, communication, learning, and social systems."

[[decks]]
id = "immunology"
order = 20
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-and-gene-regulation"]
recommended_after = ["microbiology-and-virology"]
estimated_chapters = 10
status = "proposed"
description = "Explain barrier, innate, and adaptive defense; recognition; signaling; tolerance; memory; and immune-system failure."

[[decks]]
id = "conservation-biology-and-global-change"
order = 21
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["ecology", "biodiversity-and-phylogenetics"]
recommended_after = []
estimated_chapters = 10
status = "proposed"
description = "Evaluate biodiversity loss, population viability, climate and land-use change, conservation evidence, restoration, and human dimensions."

[[decks]]
id = "genomics-and-bioinformatics"
order = 22
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-and-gene-regulation", "biological-data-and-statistical-reasoning", "computational-biology-foundations"]
recommended_after = ["biological-research-practice"]
estimated_chapters = 12
status = "proposed"
description = "Interpret sequence, variation, expression, annotation, comparative genomics, pipelines, databases, and reproducible genomic evidence."

[[decks]]
id = "systems-biology-and-quantitative-modeling"
order = 23
tier = "specialization"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-and-gene-regulation", "biological-data-and-statistical-reasoning", "computational-biology-foundations"]
recommended_after = ["genomics-and-bioinformatics"]
estimated_chapters = 10
status = "proposed"
description = "Build, analyze, fit, and critique network, dynamical, stochastic, and multiscale models of biological systems."

[[decks]]
id = "structural-biology-and-biophysics"
order = 24
tier = "specialization"
level = "undergraduate-advanced"
prerequisites = ["biochemistry-and-metabolism"]
recommended_after = ["computational-biology-foundations"]
estimated_chapters = 10
status = "proposed"
description = "Infer molecular mechanism from forces, energy landscapes, macromolecular structure, dynamics, and complementary measurement methods."

[[decks]]
id = "synthetic-biology-and-biotechnology"
order = 25
tier = "specialization"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-and-gene-regulation"]
recommended_after = ["microbiology-and-virology", "systems-biology-and-quantitative-modeling", "biological-research-practice"]
estimated_chapters = 10
status = "proposed"
description = "Design and evaluate engineered biological parts, circuits, cells, products, measurement standards, risks, and societal tradeoffs."

[[decks]]
id = "human-biology-and-disease-mechanisms"
order = 26
tier = "specialization"
level = "undergraduate-advanced"
prerequisites = ["comparative-animal-physiology", "immunology"]
recommended_after = ["microbiology-and-virology"]
estimated_chapters = 12
status = "proposed"
description = "Integrate physiology, immunity, genetics, environment, development, and evolution to explain bounded human disease mechanisms."

[[decks]]
id = "evolutionary-genomics"
order = 27
tier = "specialization"
level = "graduate"
prerequisites = ["evolution", "genomics-and-bioinformatics"]
recommended_after = ["systems-biology-and-quantitative-modeling"]
estimated_chapters = 10
status = "proposed"
description = "Use genome-scale variation and comparative data to test demographic, selective, phylogenomic, and molecular-evolution hypotheses."

[[decks]]
id = "microbial-ecology-and-evolution"
order = 28
tier = "specialization"
level = "graduate"
prerequisites = ["evolution", "ecology", "microbiology-and-virology"]
recommended_after = ["conservation-biology-and-global-change"]
estimated_chapters = 10
status = "proposed"
description = "Analyze microbial communities, interactions, biogeochemistry, host associations, horizontal transfer, and community evolution."

[[decks]]
id = "evolution-of-development"
order = 29
tier = "specialization"
level = "graduate"
prerequisites = ["evolution", "developmental-biology"]
recommended_after = ["genomics-and-bioinformatics"]
estimated_chapters = 8
status = "proposed"
description = "Explain morphological innovation and constraint by comparing developmental mechanisms, gene networks, life histories, and phylogenies."

[[decks]]
id = "ecological-forecasting-and-conservation-data"
order = 30
tier = "specialization"
level = "graduate"
prerequisites = ["conservation-biology-and-global-change", "biological-data-and-statistical-reasoning", "computational-biology-foundations"]
recommended_after = ["microbial-ecology-and-evolution"]
estimated_chapters = 10
status = "proposed"
description = "Combine monitoring data, hierarchical models, uncertainty, scenarios, and decision analysis for ecological forecasts and conservation."

[[decks]]
id = "integrative-systems-and-synthetic-biology"
order = 31
tier = "specialization"
level = "graduate"
prerequisites = ["systems-biology-and-quantitative-modeling", "synthetic-biology-and-biotechnology"]
recommended_after = ["structural-biology-and-biophysics"]
estimated_chapters = 10
status = "proposed"
description = "Integrate measurement, inference, control, design-build-test cycles, multiscale models, and responsible engineering of living systems."

[[decks]]
id = "single-cell-and-spatial-biology"
order = 32
tier = "specialization"
level = "research-specialization"
prerequisites = ["biological-research-practice", "genomics-and-bioinformatics", "systems-biology-and-quantitative-modeling"]
recommended_after = ["integrative-systems-and-synthetic-biology"]
estimated_chapters = 8
status = "proposed"
description = "Critique and integrate single-cell and spatial measurements, preprocessing, uncertainty, multimodal inference, and biological validation."

[[decks]]
id = "engineering-living-systems"
order = 33
tier = "specialization"
level = "research-specialization"
prerequisites = ["biological-research-practice", "integrative-systems-and-synthetic-biology"]
recommended_after = []
estimated_chapters = 8
status = "proposed"
description = "Read frontier literature and design research programs for programmable cells, multicellular systems, biomaterials, and biomanufacturing."

[[decks]]
id = "global-change-biosphere-science"
order = 34
tier = "specialization"
level = "research-specialization"
prerequisites = ["microbial-ecology-and-evolution", "ecological-forecasting-and-conservation-data"]
recommended_after = []
estimated_chapters = 8
status = "proposed"
description = "Synthesize organismal, microbial, ecological, remote-sensing, and Earth-system evidence about biosphere responses and feedbacks."

[[decks]]
id = "origins-and-evolution-of-life"
order = 35
tier = "specialization"
level = "research-specialization"
prerequisites = ["evolution", "microbiology-and-virology", "structural-biology-and-biophysics"]
recommended_after = []
estimated_chapters = 8
status = "proposed"
description = "Evaluate competing hypotheses and evidence for prebiotic chemistry, early cells, metabolic and genetic systems, and major evolutionary transitions."

