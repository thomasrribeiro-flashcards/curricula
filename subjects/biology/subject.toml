schema_version = 3
subject = "biology"
destination = "whole-field"
deck_granularity = "course"
focus = []

# Topologically ordered whole-field biology curriculum. Levels describe assumed
# maturity; tiers describe priority for the whole-field destination. Hard
# prerequisites are minimal and direct: an edge appears only when the dependent
# deck's first chapters cannot be understood without it. Useful but non-blocking
# preparation is recorded in recommended_after. Cross-subject references name
# decks that exist in the collection-wide catalog and are never duplicated here.

# --- Foundational -----------------------------------------------------------

[[decks]]
id = "biological-literacy-and-scientific-practice"
order = 1
tier = "core"
level = "foundational"
prerequisites = ["mathematics/number-sense-and-arithmetic"]
recommended_after = []
estimated_chapters = 9
status = "proposed"
description = "Read and reason about living systems from first contact: what distinguishes living systems, scale and unit fluency from nanometres to biomes, the cell and gene concepts as organising ideas, hypothesis and prediction, observation versus inference, controls and variables, correlation versus causation, evidence quality and scientific consensus, and the causal language discipline that replaces purpose talk."

[[decks]]
id = "chemistry-of-life"
order = 2
tier = "core"
level = "foundational"
prerequisites = ["biological-literacy-and-scientific-practice"]
recommended_after = ["mathematics/elementary-algebra-and-functions"]
estimated_chapters = 11
status = "proposed"
description = "The chemical substrate biology depends on: atoms, bonding and electronegativity, water and hydrophobic effects, acids, bases and buffers, concentration and dilution, free energy and spontaneity qualitatively, coupled reactions, catalysis, and the structure-property logic of carbohydrates, lipids, nucleic acids and proteins. Biology owns this bridge because no chemistry subject exists in the collection."

# --- Undergraduate core -----------------------------------------------------

[[decks]]
id = "experimental-design-and-data-analysis-in-biology"
order = 3
tier = "core"
level = "undergraduate-core"
prerequisites = ["chemistry-of-life", "mathematics/elementary-algebra-and-functions"]
recommended_after = ["mathematics/statistical-inference-and-data-analysis"]
estimated_chapters = 11
status = "proposed"
description = "Design and read biological experiments: treatment and control structure, randomisation, blinding, true replication versus pseudoreplication, the experimental unit, model-organism choice and its limits, dose-response and time-course designs, biological versus technical variation, reading biological data displays and error bars, effect size versus significance, and rigor, reproducibility and research ethics. Interpretation-level statistics only; formal inference is imported from mathematics."

[[decks]]
id = "cell-biology"
order = 4
tier = "core"
level = "undergraduate-core"
prerequisites = ["chemistry-of-life"]
recommended_after = []
estimated_chapters = 11
status = "proposed"
description = "The cell as a compartmentalised, self-maintaining system: membranes and selective permeability, transport and electrochemical gradients, organelles and the endomembrane route, protein targeting, cytoskeleton and motors, cell adhesion and the extracellular matrix, signal transduction, cell cycle control, cell death, and the microscopy evidence behind each claim."

[[decks]]
id = "bioenergetics-and-metabolism"
order = 5
tier = "core"
level = "undergraduate-core"
prerequisites = ["cell-biology"]
recommended_after = []
estimated_chapters = 10
status = "proposed"
description = "How cells acquire, store and spend energy and matter: ATP and redox carriers, glycolysis, pyruvate oxidation and the citric acid cycle, chemiosmosis and oxidative phosphorylation, fermentation, photosynthetic light reactions and carbon fixation, anabolic and catabolic integration, and regulation by allostery, covalent modification and substrate supply."

[[decks]]
id = "genetics-and-heredity"
order = 6
tier = "core"
level = "undergraduate-core"
prerequisites = ["cell-biology"]
recommended_after = []
estimated_chapters = 11
status = "proposed"
description = "Transmission genetics grounded in chromosome behaviour: mitosis and meiosis, segregation and independent assortment, linkage and recombination mapping, sex linkage, pedigree analysis, dominance relations and epistasis, penetrance and expressivity, chromosomal and copy-number variation, extranuclear inheritance, and quantitative reasoning about ratios and genotype frequencies."

[[decks]]
id = "molecular-biology-of-the-gene"
order = 7
tier = "core"
level = "undergraduate-core"
prerequisites = ["genetics-and-heredity"]
recommended_after = ["bioenergetics-and-metabolism"]
estimated_chapters = 12
status = "proposed"
description = "Information storage, expression and maintenance: DNA structure and replication, mutation, repair and recombination, transcription and its control, RNA processing, the genetic code and translation, protein folding and turnover, chromatin and epigenetic marks, non-coding and regulatory RNA, gene regulatory logic in bacteria and eukaryotes, and the experiments that established each mechanism."

[[decks]]
id = "evolutionary-biology"
order = 8
tier = "core"
level = "undergraduate-core"
prerequisites = ["genetics-and-heredity"]
recommended_after = ["molecular-biology-of-the-gene"]
estimated_chapters = 11
status = "proposed"
description = "Evolution as the unifying causal framework: variation and its origins, Hardy-Weinberg reasoning, selection, drift, migration and mutation as allele-frequency processes, fitness and adaptation without teleology, sexual selection, speciation and reproductive isolation, molecular evolution and neutrality, homology versus analogy, phylogenetic tree reading, and the evidence from fossils, comparative anatomy, biogeography and genomes."

[[decks]]
id = "animal-physiology-and-homeostasis"
order = 9
tier = "recommended"
level = "undergraduate-core"
prerequisites = ["bioenergetics-and-metabolism"]
recommended_after = ["physics/measurement-and-physical-reasoning"]
estimated_chapters = 11
status = "proposed"
description = "Integrated animal function from a structure-function and regulation stance: exchange surfaces and scaling, circulation and gas transport, digestion and energy budgets, osmoregulation and excretion, thermoregulation, endocrine signalling and feedback loops, muscle and movement, reproduction, and comparative solutions to shared physical constraints."

[[decks]]
id = "plant-biology"
order = 10
tier = "recommended"
level = "undergraduate-core"
prerequisites = ["bioenergetics-and-metabolism"]
recommended_after = ["evolutionary-biology"]
estimated_chapters = 11
status = "proposed"
description = "Plants as autotrophic, modular, sessile organisms: tissues and meristems, root and shoot architecture, water potential and long-distance transport, stomatal control and the water-carbon trade-off, mineral nutrition and symbioses, C4 and CAM variants, hormones and photomorphogenesis, flowering and reproduction, seed and fruit biology, and defence responses."

[[decks]]
id = "microbiology-and-virology"
order = 11
tier = "core"
level = "undergraduate-core"
prerequisites = ["bioenergetics-and-metabolism", "molecular-biology-of-the-gene"]
recommended_after = ["evolutionary-biology"]
estimated_chapters = 11
status = "proposed"
description = "Microbial life and viruses: prokaryotic cell architecture, growth kinetics and culture, metabolic and respiratory diversity, horizontal gene transfer and mobile elements, antimicrobial action and resistance evolution, biofilms and quorum sensing, archaeal distinctiveness, microbial ecology and biogeochemical roles, viral structure, replication strategies and host interactions."

[[decks]]
id = "biological-diversity-and-the-tree-of-life"
order = 12
tier = "core"
level = "undergraduate-core"
prerequisites = ["evolutionary-biology"]
recommended_after = ["microbiology-and-virology"]
estimated_chapters = 10
status = "proposed"
description = "Organise the living world phylogenetically: species concepts and their operational limits, nomenclature and classification practice, monophyly and character polarity, the domains and major eukaryotic supergroups, plant, fungal and animal body-plan radiations, key transitions such as multicellularity and terrestrialisation, the fossil and molecular evidence for deep relationships, and how to read and interpret published trees critically."

[[decks]]
id = "population-and-community-ecology"
order = 13
tier = "core"
level = "undergraduate-core"
prerequisites = ["evolutionary-biology", "experimental-design-and-data-analysis-in-biology"]
recommended_after = ["mathematics/statistical-inference-and-data-analysis"]
estimated_chapters = 11
status = "proposed"
description = "Distribution and abundance of organisms: niche and tolerance, population growth models and density dependence, life tables and life-history strategies, metapopulations and dispersal, competition and coexistence, predation, herbivory and parasitism, mutualism, food webs and trophic cascades, succession and disturbance, and diversity measurement and sampling design."

# --- Undergraduate advanced -------------------------------------------------

[[decks]]
id = "protein-structure-function-and-enzymology"
order = 14
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["bioenergetics-and-metabolism"]
recommended_after = ["physics/thermodynamics-and-statistical-mechanics"]
estimated_chapters = 10
status = "proposed"
description = "Quantitative biochemistry of macromolecules: folding energetics and the folding problem, structural hierarchy and motifs, binding equilibria and cooperativity, Michaelis-Menten and steady-state kinetics, inhibition patterns, catalytic strategies and transition-state stabilisation, allosteric and covalent regulation, membrane and nucleic-acid-binding proteins, and how structures are determined and validated."

[[decks]]
id = "experimental-methods-in-molecular-and-cell-biology"
order = 15
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-of-the-gene", "experimental-design-and-data-analysis-in-biology"]
recommended_after = ["protein-structure-function-and-enzymology"]
estimated_chapters = 11
status = "proposed"
description = "What a modern wet-lab result actually shows: nucleic-acid and protein separation and detection, PCR and quantitative PCR, cloning and vectors, sequencing chemistries, CRISPR and RNA-interference perturbation, reporters and tagging, fluorescence and live-cell imaging, flow cytometry, immunoprecipitation and interaction assays, essential controls, and the failure modes and artefacts of each method."

[[decks]]
id = "developmental-biology"
order = 16
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-of-the-gene"]
recommended_after = ["experimental-methods-in-molecular-and-cell-biology"]
estimated_chapters = 10
status = "proposed"
description = "How a genome builds an organism: fertilisation and cleavage, axis specification, morphogen gradients and positional information, induction and competence, conserved signalling pathways, Hox genes and segmental identity, organogenesis case studies, stem cells and potency, regeneration, and evolutionary developmental comparison."

[[decks]]
id = "neurobiology"
order = 17
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["animal-physiology-and-homeostasis"]
recommended_after = ["developmental-biology", "physics/electricity-magnetism-and-circuits"]
estimated_chapters = 11
status = "proposed"
description = "Nervous systems from membranes to circuits: resting potential and the Nernst and Goldman relations, voltage-gated channels and action-potential mechanism, cable properties and conduction, synaptic transmission and integration, neurotransmitter systems, sensory transduction and coding, motor control, circuit motifs, synaptic plasticity and learning, development and wiring, and the recording and stimulation methods that support each claim."

[[decks]]
id = "immunology"
order = 18
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["microbiology-and-virology"]
recommended_after = ["experimental-methods-in-molecular-and-cell-biology"]
estimated_chapters = 11
status = "proposed"
description = "Host defence as an information and selection system: barriers and innate recognition, complement and inflammation, antigen processing and MHC restriction, receptor gene rearrangement and repertoire generation, clonal selection and affinity maturation, T and B cell activation and effector programmes, tolerance and autoimmunity, memory and vaccination, immune evasion, and mucosal and tumour immunity."

[[decks]]
id = "ecosystem-ecology-and-global-change"
order = 19
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["population-and-community-ecology"]
recommended_after = ["plant-biology", "microbiology-and-virology"]
estimated_chapters = 10
status = "proposed"
description = "Energy and matter at ecosystem and planetary scale: primary and secondary production, trophic efficiency, decomposition and soil processes, carbon, nitrogen and phosphorus cycles, water and energy budgets, landscape and biome patterns, ecosystem services, drivers and biological consequences of climate and land-use change, eutrophication and nutrient pollution, and observational and manipulative evidence at large scale."

[[decks]]
id = "animal-behavior-and-behavioral-ecology"
order = 20
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["evolutionary-biology"]
recommended_after = ["population-and-community-ecology", "neurobiology"]
estimated_chapters = 9
status = "proposed"
description = "Behaviour as an evolved and mechanistic phenotype: Tinbergen's four questions, measuring behaviour with ethograms and rigorous observation, learning and development of behaviour, optimal foraging, mating systems and sexual selection, parental investment and conflict, inclusive fitness and cooperation, communication and signal reliability, social organisation, and simple game-theoretic reasoning about strategies."

[[decks]]
id = "population-and-quantitative-genetics"
order = 21
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["evolutionary-biology", "mathematics/probability"]
recommended_after = ["mathematics/statistical-inference-and-data-analysis"]
estimated_chapters = 11
status = "proposed"
description = "Formal models of genetic change and trait variation: allele and genotype frequency dynamics, effective population size and drift, mutation-selection balance, inbreeding and relatedness coefficients, linkage disequilibrium, population structure and coalescent intuition, variance partitioning and heritability, breeder's equation and selection response, multi-locus and polygenic traits, and association mapping and its confounds."

[[decks]]
id = "genomics-and-bioinformatics"
order = 22
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-of-the-gene", "mathematics/mathematical-computing-and-experimentation"]
recommended_after = ["experimental-design-and-data-analysis-in-biology", "experimental-methods-in-molecular-and-cell-biology"]
estimated_chapters = 12
status = "proposed"
description = "Genome-scale data and the computation that interprets it: genome architecture and content, sequencing platforms and their error models, read alignment and assembly, variant calling and quality filtering, sequence alignment and homology search, annotation and ontologies, transcriptome quantification and differential expression, epigenomic and chromatin assays, comparative and functional genomics, reproducible workflows, and multiple-testing discipline."

[[decks]]
id = "statistical-phylogenetics-and-comparative-methods"
order = 23
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["biological-diversity-and-the-tree-of-life", "mathematics/probability"]
recommended_after = ["genomics-and-bioinformatics", "mathematics/statistical-inference-and-data-analysis"]
estimated_chapters = 10
status = "proposed"
description = "Inferring and using trees quantitatively: character and alignment choice, substitution models and rate heterogeneity, parsimony, likelihood and Bayesian inference, support measures and their meaning, gene trees versus species trees and coalescent discordance, molecular dating and calibration, ancestral state reconstruction, phylogenetically independent contrasts and comparative models, and diversification rate analysis."

[[decks]]
id = "cancer-biology"
order = 24
tier = "specialization"
level = "undergraduate-advanced"
prerequisites = ["molecular-biology-of-the-gene"]
recommended_after = ["immunology", "genomics-and-bioinformatics"]
estimated_chapters = 10
status = "proposed"
description = "Cancer as somatic evolution and deregulated cell biology: mutation and clonal expansion, oncogenes and tumour suppressors, checkpoint and apoptosis failure, genome instability, replicative immortality, metabolic rewiring, angiogenesis, invasion and metastasis, tumour microenvironment and immune interaction, heterogeneity and resistance, and the logic of targeted and immune therapies."

[[decks]]
id = "infectious-disease-and-epidemiology"
order = 25
tier = "specialization"
level = "undergraduate-advanced"
prerequisites = ["microbiology-and-virology", "experimental-design-and-data-analysis-in-biology"]
recommended_after = ["immunology", "mathematics/statistical-inference-and-data-analysis"]
estimated_chapters = 10
status = "proposed"
description = "How pathogens spread and how that is measured: pathogenesis and virulence determinants, transmission routes and reservoirs, incidence, prevalence and rate measures, study designs and bias, compartmental transmission models and the basic reproduction number, herd immunity thresholds, outbreak investigation and surveillance, vector-borne and zoonotic spillover, antimicrobial resistance in populations, and intervention evaluation."

[[decks]]
id = "conservation-biology-and-restoration"
order = 26
tier = "specialization"
level = "undergraduate-advanced"
prerequisites = ["population-and-community-ecology"]
recommended_after = ["ecosystem-ecology-and-global-change", "population-and-quantitative-genetics"]
estimated_chapters = 11
status = "proposed"
description = "Applying ecological and evolutionary theory to biodiversity loss: extinction risk and its drivers, small-population and declining-population paradigms, genetic issues in small populations, population viability analysis, habitat loss, fragmentation and connectivity, invasive species, protected-area design and systematic prioritisation, restoration approaches and success criteria, monitoring and adaptive management, and the human, legal and ethical dimensions."

[[decks]]
id = "biotechnology-and-synthetic-biology"
order = 27
tier = "specialization"
level = "undergraduate-advanced"
prerequisites = ["experimental-methods-in-molecular-and-cell-biology"]
recommended_after = ["protein-structure-function-and-enzymology", "genomics-and-bioinformatics"]
estimated_chapters = 11
status = "proposed"
description = "Engineering biological systems for defined purposes: heterologous expression and host choice, protein engineering and directed evolution, industrial and therapeutic biologics, metabolic engineering and pathway balancing, standardised parts, genetic circuits and their failure modes, biosensors, cell-free and in vitro systems, genome-scale construction, scale-up and process constraints, and biosafety, biosecurity and governance."

# --- Graduate ---------------------------------------------------------------

[[decks]]
id = "methods-and-logic-of-biological-research"
order = 28
tier = "core"
level = "graduate"
prerequisites = [
  "experimental-design-and-data-analysis-in-biology",
  "molecular-biology-of-the-gene",
  "mathematics/statistical-inference-and-data-analysis",
]
recommended_after = [
  "experimental-methods-in-molecular-and-cell-biology",
  "genomics-and-bioinformatics",
  "population-and-community-ecology",
]
estimated_chapters = 9
status = "proposed"
description = "The research-practice layer that separates coursework from literature-facing work: dissecting primary papers claim by claim, matching inference to design, judging whether controls and sample structure license a conclusion, alternative explanations and confounding, model and effect-size reasoning, preregistration, reproducibility and statistical error culture, peer review and publication norms, and research ethics, authorship and integrity. Branch-neutral so both the molecular and eco-evolutionary routes pass through it."

[[decks]]
id = "macromolecular-structure-and-mechanism"
order = 29
tier = "specialization"
level = "graduate"
prerequisites = ["protein-structure-function-and-enzymology", "methods-and-logic-of-biological-research"]
recommended_after = []
estimated_chapters = 10
status = "proposed"
description = "Mechanism at atomic resolution: conformational landscapes and dynamics, pre-steady-state and single-turnover kinetics, transition-state and isotope-effect analysis, allostery and ensemble models, macromolecular machines and motors, membrane protein and transporter mechanism, protein-nucleic-acid complexes, biomolecular condensates, and critical evaluation of crystallographic, cryo-EM, NMR and mass-spectrometry evidence."

[[decks]]
id = "advanced-genetics-and-genome-engineering"
order = 30
tier = "specialization"
level = "graduate"
prerequisites = [
  "experimental-methods-in-molecular-and-cell-biology",
  "genomics-and-bioinformatics",
  "methods-and-logic-of-biological-research",
]
recommended_after = []
estimated_chapters = 10
status = "proposed"
description = "Designing and interpreting genetic dissection at scale: forward and reverse genetic strategy, suppressor, enhancer and epistasis analysis, conditional and tissue-specific perturbation, precise editing, base and prime editing, pooled CRISPR screens and their readouts, saturation mutagenesis and deep mutational scanning, regulatory-element and non-coding perturbation, off-target and penetrance controls, and causal inference from perturbation data."

[[decks]]
id = "systems-and-quantitative-biology"
order = 31
tier = "core"
level = "graduate"
prerequisites = [
  "genomics-and-bioinformatics",
  "methods-and-logic-of-biological-research",
  "mathematics/differential-equations",
]
recommended_after = ["mathematics/dynamical-systems-and-ergodic-theory", "physics/biological-physics"]
estimated_chapters = 11
status = "proposed"
description = "Treat cells and networks as dynamical, noisy, measurable systems: mass-action and enzymatic rate models, steady states, stability and bifurcation, feedback motifs, bistability and oscillation, network motifs and modularity, stochastic gene expression and single-cell variability, parameter estimation and model identifiability, high-dimensional data structure and dimensionality reduction, model selection and validation, and the limits of fitted models."

[[decks]]
id = "theoretical-ecology-and-evolutionary-dynamics"
order = 32
tier = "specialization"
level = "graduate"
prerequisites = [
  "methods-and-logic-of-biological-research",
  "population-and-quantitative-genetics",
  "population-and-community-ecology",
  "mathematics/differential-equations",
]
recommended_after = ["mathematics/dynamical-systems-and-ergodic-theory"]
estimated_chapters = 11
status = "proposed"
description = "Formal theory for populations, communities and evolving systems: structured population models and matrix projection, stability and invasion analysis, coexistence and modern coexistence theory, spatial and metacommunity dynamics, stochastic demography and extinction risk, adaptive dynamics and evolutionarily stable strategies, eco-evolutionary feedback, epidemiological and multispecies dynamics, and confronting theoretical models with field and time-series data."

# --- Research specialization ------------------------------------------------

[[decks]]
id = "protein-design-and-computational-structural-biology"
order = 33
tier = "specialization"
level = "research-specialization"
prerequisites = ["macromolecular-structure-and-mechanism", "systems-and-quantitative-biology"]
recommended_after = []
estimated_chapters = 9
status = "proposed"
description = "Current practice in predicting and designing macromolecules: energy functions and sampling, coevolution signals, deep-learning structure prediction and its confidence measures, complex and interface prediction, fixed-backbone and de novo design, binder and enzyme design, generative sequence and backbone models, benchmarking and data leakage, and mandatory experimental validation of computational claims."

[[decks]]
id = "single-cell-and-spatial-omics"
order = 34
tier = "specialization"
level = "research-specialization"
prerequisites = ["systems-and-quantitative-biology", "experimental-methods-in-molecular-and-cell-biology"]
recommended_after = []
estimated_chapters = 9
status = "proposed"
description = "Measuring and interpreting molecular state cell by cell and in situ: droplet and plate-based single-cell protocols, multiome and lineage-tracing readouts, spatial transcriptomics and imaging-based methods, dropout, ambient signal and doublet artefacts, normalisation and batch correction, clustering, annotation and label transfer, trajectory and RNA-velocity inference and their assumptions, differential abundance and expression across conditions, and reproducible atlas-scale analysis."

[[decks]]
id = "evolutionary-and-population-genomics"
order = 35
tier = "specialization"
level = "research-specialization"
prerequisites = [
  "population-and-quantitative-genetics",
  "genomics-and-bioinformatics",
  "methods-and-logic-of-biological-research",
]
recommended_after = []
estimated_chapters = 10
status = "proposed"
description = "Reading evolutionary history and selection from genome-scale variation: variation data sets and their ascertainment, site frequency spectra and demographic inference, coalescent and ancestral recombination graph methods, selection scans and their false-positive structure, background selection and linked selection, admixture and introgression statistics, ancient DNA, comparative genomics and molecular rate estimation, and polygenic architecture and portability limits."

[[decks]]
id = "neural-circuits-and-connectomics"
order = 36
tier = "specialization"
level = "research-specialization"
prerequisites = ["neurobiology", "systems-and-quantitative-biology"]
recommended_after = []
estimated_chapters = 10
status = "proposed"
description = "Circuit-level neuroscience as a measurement and modelling problem: large-scale electrophysiology and calcium and voltage imaging, optogenetic and chemogenetic causal manipulation, cell-type taxonomy and molecular identity, volume electron microscopy and connectome reconstruction, wiring statistics and circuit motifs, population coding and dimensionality, recurrent network models of computation, behavioural quantification, and matching circuit claims to the evidence that supports them."

[[decks]]
id = "host-microbiome-and-infection-biology"
order = 37
tier = "specialization"
level = "research-specialization"
prerequisites = ["immunology", "genomics-and-bioinformatics", "methods-and-logic-of-biological-research"]
recommended_after = []
estimated_chapters = 10
status = "proposed"
description = "Host-associated microbial communities and pathogens at research level: amplicon versus shotgun metagenomic inference, assembly of genomes from communities, compositional data pitfalls, gnotobiotic and colonisation experiments, causation versus correlation in microbiome claims, metabolite and immune mediators, colonisation resistance and community ecology of the gut, within-host pathogen evolution and resistance emergence, and therapeutic and diagnostic translation."

[[decks]]
id = "global-change-biology-and-biodiversity-science"
order = 38
tier = "specialization"
level = "research-specialization"
prerequisites = ["ecosystem-ecology-and-global-change", "theoretical-ecology-and-evolutionary-dynamics"]
recommended_after = ["conservation-biology-and-restoration"]
estimated_chapters = 10
status = "proposed"
description = "Biological research on planetary change: long-term monitoring networks, remote sensing and eDNA as biodiversity observation, detection and attribution of biological responses, thermal and physiological limits and vulnerability, phenological shifts and range dynamics, species distribution models and their extrapolation risks, evolutionary and plastic responses to rapid change, tipping points and regime shifts, scenario and assessment frameworks, and the science-policy interface."

# --- Coverage ---------------------------------------------------------------

[[coverage]]
domain = "scientific-practice-and-biological-literacy"
disposition = "included"
decks = ["biological-literacy-and-scientific-practice", "experimental-design-and-data-analysis-in-biology"]
rationale = "Entry point for a cold-start learner and the source of the non-teleological causal language, scale fluency and design vocabulary every later deck reuses."

[[coverage]]
domain = "chemical-and-energetic-foundations"
disposition = "included"
decks = ["chemistry-of-life"]
rationale = "No chemistry subject exists in the collection catalog, so biology owns the minimum chemical substrate its own mechanisms require."

[[coverage]]
domain = "cell-biology"
disposition = "included"
decks = ["cell-biology"]
rationale = "The cell is the universal structural and functional unit assumed by physiology, genetics, development and disease decks."

[[coverage]]
domain = "metabolism-and-bioenergetics"
disposition = "included"
decks = ["bioenergetics-and-metabolism"]
rationale = "Pathways and transformations of energy and matter is a crosscutting idea of the field and a prerequisite for physiology, plants, microbes and biochemistry."

[[coverage]]
domain = "transmission-and-molecular-genetics"
disposition = "included"
decks = ["genetics-and-heredity", "molecular-biology-of-the-gene"]
rationale = "Split because chromosome-based transmission reasoning and molecular information flow are separately gradable capabilities that would otherwise exceed a coherent course-sized deck."

[[coverage]]
domain = "epigenetics-and-chromatin"
disposition = "included"
decks = ["molecular-biology-of-the-gene", "genomics-and-bioinformatics"]
rationale = "Chromatin mechanism belongs with gene expression control; genome-scale chromatin assays and their interpretation belong with genomics."

[[coverage]]
domain = "biochemistry-and-structural-biology"
disposition = "included"
decks = ["protein-structure-function-and-enzymology", "macromolecular-structure-and-mechanism", "protein-design-and-computational-structural-biology"]
rationale = "Three maturity layers: undergraduate binding and kinetics, graduate mechanism and structural evidence, and research-level prediction and design."

[[coverage]]
domain = "evolutionary-biology"
disposition = "included"
decks = ["evolutionary-biology", "population-and-quantitative-genetics", "evolutionary-and-population-genomics"]
rationale = "Evolution is the field's central unifying idea and needs a conceptual deck, a formal population-genetic deck and a genome-scale research deck."

[[coverage]]
domain = "systematics-and-biodiversity"
disposition = "included"
decks = ["biological-diversity-and-the-tree-of-life", "statistical-phylogenetics-and-comparative-methods"]
rationale = "Separates reading and interpreting the tree of life from inferring trees and using them as a statistical framework."

[[coverage]]
domain = "microbiology-and-virology"
disposition = "included"
decks = ["microbiology-and-virology"]
rationale = "Microbes and viruses dominate biological diversity, drive biogeochemistry and underpin immunology, infectious disease and biotechnology."

[[coverage]]
domain = "immunology"
disposition = "included"
decks = ["immunology"]
rationale = "A coherent course-sized system with its own selection and recognition logic, required for infection, microbiome and cancer work."

[[coverage]]
domain = "animal-physiology"
disposition = "included"
decks = ["animal-physiology-and-homeostasis"]
