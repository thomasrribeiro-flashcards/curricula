schema_version = 3
subject = "physics"
destination = "whole-field"
deck_granularity = "course"
focus = []

# ---------------------------------------------------------------------------
# Foundational layer: physical literacy before calculus.
# Nothing here assumes prior physics vocabulary.
# ---------------------------------------------------------------------------

[[decks]]
id = "measurement-and-physical-reasoning"
order = 1
tier = "core"
level = "foundational"
prerequisites = ["mathematics/number-sense-and-arithmetic"]
recommended_after = []
estimated_chapters = 8
status = "proposed"
description = "Describe physical situations with operational quantities, SI units, scale, proportional reasoning, graphs, uncertainty, and explicit models."

[[decks]]
id = "motion-forces-and-energy"
order = 2
tier = "core"
level = "foundational"
prerequisites = ["measurement-and-physical-reasoning", "mathematics/elementary-algebra-and-functions"]
recommended_after = []
estimated_chapters = 12
status = "proposed"
description = "Predict and explain the motion of everyday objects using kinematics, interactions and forces, momentum, energy, torque, and gravitation without calculus."

[[decks]]
id = "matter-fluids-and-thermal-behavior"
order = 3
tier = "core"
level = "foundational"
prerequisites = ["motion-forces-and-energy"]
recommended_after = []
estimated_chapters = 9
status = "proposed"
description = "Explain the macroscopic behavior of solids, liquids, and gases through density, pressure, buoyancy, flow, temperature, heat, phase change, and the kinetic-molecular model."

[[decks]]
id = "waves-sound-and-light"
order = 4
tier = "core"
level = "foundational"
prerequisites = ["motion-forces-and-energy", "mathematics/precalculus-and-trigonometry"]
recommended_after = ["matter-fluids-and-thermal-behavior"]
estimated_chapters = 10
status = "proposed"
description = "Analyze oscillation, wave propagation, superposition, resonance, sound, reflection and refraction, image formation, and elementary interference and diffraction."

[[decks]]
id = "electricity-magnetism-and-circuits"
order = 5
tier = "core"
level = "foundational"
prerequisites = ["motion-forces-and-energy", "mathematics/precalculus-and-trigonometry"]
recommended_after = ["waves-sound-and-light"]
estimated_chapters = 11
status = "proposed"
description = "Reason about charge, electric and magnetic fields, potential, current, resistance, DC and AC circuits, induction, and electromagnetic waves at an algebra-based level."

# ---------------------------------------------------------------------------
# Undergraduate core: the calculus-based shared foundation, including the
# experimental and computational practices that professional bodies treat as
# first-class physics competencies rather than support skills.
# ---------------------------------------------------------------------------

[[decks]]
id = "measurement-uncertainty-and-experimental-physics"
order = 6
tier = "core"
level = "undergraduate-core"
prerequisites = ["measurement-and-physical-reasoning", "mathematics/statistical-inference-and-data-analysis"]
recommended_after = ["motion-forces-and-energy", "electricity-magnetism-and-circuits"]
estimated_chapters = 9
status = "proposed"
description = "Design measurements, quantify and propagate uncertainty, separate random from systematic error, fit physical models to data, and report experimental claims honestly."

[[decks]]
id = "computational-physics"
order = 7
tier = "core"
level = "undergraduate-core"
prerequisites = ["motion-forces-and-energy", "mathematics/mathematical-computing-and-experimentation", "mathematics/single-variable-integral-calculus"]
recommended_after = ["measurement-uncertainty-and-experimental-physics"]
estimated_chapters = 10
status = "proposed"
description = "Translate a physical model into code, choose scales and algorithms, integrate equations of motion, sample stochastic systems, visualize results, and validate a simulation against limits and conservation laws."

[[decks]]
id = "classical-mechanics"
order = 8
tier = "core"
level = "undergraduate-core"
prerequisites = ["motion-forces-and-energy", "mathematics/differential-equations", "mathematics/multivariable-and-vector-calculus"]
recommended_after = ["computational-physics"]
estimated_chapters = 11
status = "proposed"
description = "Solve calculus-based dynamics: vector equations of motion, damped and driven oscillation, central forces and orbits, rigid-body rotation, non-inertial frames, and coupled normal modes."

[[decks]]
id = "special-relativity"
order = 9
tier = "core"
level = "undergraduate-core"
prerequisites = ["motion-forces-and-energy", "mathematics/linear-algebra", "mathematics/single-variable-differential-calculus"]
recommended_after = ["classical-mechanics"]
estimated_chapters = 8
status = "proposed"
description = "Reason with relativity of simultaneity, Lorentz transformations, spacetime diagrams, the invariant interval, four-vectors, and relativistic energy and momentum."

[[decks]]
id = "quantum-phenomena-and-atomic-structure"
order = 10
tier = "core"
level = "undergraduate-core"
prerequisites = ["waves-sound-and-light", "electricity-magnetism-and-circuits"]
recommended_after = ["special-relativity", "classical-mechanics"]
estimated_chapters = 10
status = "proposed"
description = "Interpret the experimental evidence for quantization: blackbody and photoelectric results, photons, matter waves, atomic spectra and energy-level diagrams, uncertainty, X-rays, radioactivity, and stimulated emission."

[[decks]]
id = "thermodynamics-and-statistical-mechanics"
order = 11
tier = "core"
level = "undergraduate-core"
prerequisites = ["matter-fluids-and-thermal-behavior", "quantum-phenomena-and-atomic-structure", "mathematics/multivariable-and-vector-calculus", "mathematics/probability"]
recommended_after = ["classical-mechanics", "computational-physics"]
estimated_chapters = 12
status = "proposed"
description = "Connect macroscopic thermodynamic laws, entropy, and potentials to microscopic counting through ensembles, partition functions, equipartition, kinetic theory, and quantum statistics."

[[decks]]
id = "electronics-and-instrumentation"
order = 12
tier = "core"
level = "undergraduate-core"
prerequisites = ["electricity-magnetism-and-circuits", "measurement-uncertainty-and-experimental-physics"]
recommended_after = ["computational-physics"]
estimated_chapters = 10
status = "proposed"
description = "Build and debug the measurement chain: network analysis, filters, diodes and transistors, operational amplifiers, digital logic, sampling, transducers, noise and shielding, and vacuum and cryogenic practice."

# ---------------------------------------------------------------------------
# Undergraduate advanced: upper-division depth and the breadth surveys that
# make each contemporary branch approachable.
# ---------------------------------------------------------------------------

[[decks]]
id = "mathematical-methods-for-physics"
order = 13
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["classical-mechanics", "mathematics/complex-analysis", "mathematics/partial-differential-equations"]
recommended_after = ["computational-physics", "special-relativity"]
estimated_chapters = 11
status = "proposed"
description = "Translate mathematical machinery into physics: index and tensor notation, curvilinear coordinates, Green functions, special functions and orthogonal expansions, distributions, contour methods, variational calculus, symmetry groups, and asymptotic approximation."

[[decks]]
id = "electromagnetic-theory"
order = 14
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["electricity-magnetism-and-circuits", "special-relativity", "mathematics/partial-differential-equations"]
recommended_after = ["classical-mechanics", "mathematical-methods-for-physics"]
estimated_chapters = 12
status = "proposed"
description = "Work with Maxwell's equations as a field theory: boundary-value electrostatics, dielectric and magnetic media, induction, potentials and gauge, energy and momentum flux, wave propagation, and the covariant formulation."

[[decks]]
id = "quantum-mechanics"
order = 15
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["quantum-phenomena-and-atomic-structure", "mathematics/partial-differential-equations"]
recommended_after = ["classical-mechanics", "mathematical-methods-for-physics", "computational-physics"]
estimated_chapters = 13
status = "proposed"
description = "Solve and interpret non-relativistic quantum mechanics: the Schrodinger equation, bound and scattering states in one dimension, operator formalism and Dirac notation, angular momentum, hydrogen, spin, identical particles, and perturbative and variational approximation."

[[decks]]
id = "analytical-mechanics"
order = 16
tier = "core"
level = "undergraduate-advanced"
prerequisites = ["classical-mechanics"]
recommended_after = ["mathematical-methods-for-physics"]
estimated_chapters = 9
status = "proposed"
description = "Reformulate mechanics through variational principles: Lagrangians and constraints, Noether symmetry and conservation, Hamiltonians, Poisson brackets, canonical transformations, Liouville flow, action-angle variables, and the onset of Hamiltonian chaos."

[[decks]]
id = "optics-and-photonics"
order = 17
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["electromagnetic-theory"]
recommended_after = ["quantum-mechanics", "electronics-and-instrumentation"]
estimated_chapters = 10
status = "proposed"
description = "Design and analyze optical systems using polarization, coherence, interference, Fourier diffraction theory, Gaussian beams, resonators, laser gain, detection, and introductory nonlinear optics."

[[decks]]
id = "continuum-mechanics-and-fluid-dynamics"
order = 18
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["classical-mechanics", "mathematics/partial-differential-equations"]
recommended_after = ["thermodynamics-and-statistical-mechanics", "computational-physics"]
estimated_chapters = 11
status = "proposed"
description = "Treat matter as a continuum: stress and strain, elasticity, Euler and Navier-Stokes equations, vorticity, potential flow, dimensionless similarity, boundary layers, waves in fluids, instability, and the route to turbulence."

[[decks]]
id = "condensed-matter-and-solid-state-physics"
order = 19
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["quantum-mechanics", "thermodynamics-and-statistical-mechanics"]
recommended_after = ["mathematical-methods-for-physics"]
estimated_chapters = 12
status = "proposed"
description = "Explain the properties of solids from structure: crystal and reciprocal lattices, diffraction, phonons and thermal behavior, free-electron and band theory, semiconductors, magnetism, superconductivity, and the role of defects and disorder."

[[decks]]
id = "nuclear-and-particle-physics"
order = 20
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["quantum-mechanics", "special-relativity"]
recommended_after = ["electronics-and-instrumentation", "mathematical-methods-for-physics"]
estimated_chapters = 12
status = "proposed"
description = "Survey subatomic matter: nuclear size and binding, liquid-drop and shell models, decay and reaction kinematics, cross sections, fission and fusion, detection, conservation laws and symmetries, quarks and leptons, and the Standard Model picture."

[[decks]]
id = "astrophysics-and-cosmology"
order = 21
tier = "recommended"
level = "undergraduate-advanced"
prerequisites = ["quantum-mechanics", "thermodynamics-and-statistical-mechanics", "electromagnetic-theory"]
recommended_after = ["measurement-uncertainty-and-experimental-physics", "computational-physics"]
estimated_chapters = 13
status = "proposed"
description = "Infer astrophysical properties from light: magnitudes and spectra, radiative transfer, stellar structure and evolution, nucleosynthesis, compact objects, the interstellar medium, galaxies, cosmic expansion, and the standard cosmological model."

# ---------------------------------------------------------------------------
# Graduate layer. Decks 22-24 are the near-universal graduate common core;
# decks 25-34 are the branch theories; deck 35 is the research-method layer
# that every research-specialization deck depends on.
# ---------------------------------------------------------------------------

[[decks]]
id = "advanced-electromagnetic-theory"
order = 22
tier = "core"
level = "graduate"
prerequisites = ["electromagnetic-theory", "mathematical-methods-for-physics"]
recommended_after = ["analytical-mechanics", "optics-and-photonics"]
estimated_chapters = 10
status = "proposed"
description = "Solve graduate electrodynamics: Green-function boundary-value problems, multipole expansions, waveguides and cavities, dispersion in media, Lienard-Wiechert radiation, scattering and diffraction, radiation reaction, and the Lagrangian field formulation with its stress-energy tensor."

[[decks]]
id = "advanced-quantum-mechanics"
order = 23
tier = "core"
level = "graduate"
prerequisites = ["quantum-mechanics", "mathematical-methods-for-physics"]
recommended_after = ["analytical-mechanics", "advanced-electromagnetic-theory"]
estimated_chapters = 12
status = "proposed"
description = "Use the full quantum formalism: Hilbert-space structure and pictures, symmetry and SU(2) angular momentum, fine and hyperfine structure, gauge invariance and Aharonov-Bohm, Berry phase, density matrices and entanglement measures, second quantization, path integrals, and formal scattering theory."

[[decks]]
id = "statistical-physics"
order = 24
tier = "core"
level = "graduate"
prerequisites = ["thermodynamics-and-statistical-mechanics", "quantum-mechanics", "mathematical-methods-for-physics"]
recommended_after = ["advanced-quantum-mechanics", "computational-physics", "mathematics/stochastic-processes"]
estimated_chapters = 12
status = "proposed"
description = "Analyze many-particle systems: quantum ideal gases and condensation, interacting models, phase transitions and critical exponents, mean-field theory and its failures, the renormalization group, fluctuation-dissipation and linear response, the Boltzmann equation, and stochastic and far-from-equilibrium dynamics."

[[decks]]
id = "general-relativity"
order = 25
tier = "specialization"
level = "graduate"
prerequisites = ["electromagnetic-theory", "analytical-mechanics", "mathematical-methods-for-physics"]
recommended_after = ["advanced-electromagnetic-theory", "mathematics/differential-geometry-and-manifolds"]
estimated_chapters = 11
status = "proposed"
description = "Do gravitational physics geometrically: manifolds and tensor fields, the equivalence principle, covariant derivatives and geodesics, curvature, the Einstein field equations and their variational derivation, Schwarzschild and Kerr solutions, the classic tests, and linearized gravitational waves."

[[decks]]
id = "quantum-field-theory"
order = 26
tier = "specialization"
level = "graduate"
prerequisites = ["advanced-quantum-mechanics", "analytical-mechanics", "electromagnetic-theory"]
recommended_after = ["advanced-electromagnetic-theory", "statistical-physics", "mathematics/representation-theory-and-lie-theory"]
estimated_chapters = 12
status = "proposed"
description = "Quantize fields and compute with them: classical field Lagrangians and Poincare symmetry, canonical quantization of scalar, spinor, and gauge fields, the path integral, Feynman rules and QED amplitudes, loop divergences and renormalization, running couplings, spontaneous symmetry breaking, and effective field theory."

[[decks]]
id = "quantum-information-and-computation"
order = 27
tier = "specialization"
level = "graduate"
prerequisites = ["quantum-mechanics"]
recommended_after = ["advanced-quantum-mechanics", "computational-physics", "mathematics/information-theory"]
estimated_chapters = 12
status = "proposed"
description = "Treat quantum systems as information carriers: qubits, density matrices, channels and measurement, entanglement and Bell tests, circuits and universal gate sets, the core algorithms, error correction and fault tolerance, quantum entropy and channel capacity, decoherence and open-system dynamics, and the leading hardware platforms."

[[decks]]
id = "condensed-matter-theory"
order = 28
tier = "specialization"
level = "graduate"
prerequisites = ["condensed-matter-and-solid-state-physics", "advanced-quantum-mechanics", "statistical-physics"]
recommended_after = ["quantum-field-theory", "computational-physics"]
estimated_chapters = 12
status = "proposed"
description = "Analyze interacting electrons and emergent order: second-quantized many-body Hamiltonians, screening and Fermi-liquid theory, electron-phonon coupling and BCS superconductivity, magnetism and spin models, Green functions and response, broken symmetry and order parameters, Berry curvature and topological phases, and quantum Hall physics."

[[decks]]
id = "atomic-molecular-and-optical-physics"
order = 29
tier = "specialization"
level = "graduate"
prerequisites = ["advanced-quantum-mechanics", "optics-and-photonics"]
recommended_after = ["electronics-and-instrumentation", "quantum-information-and-computation"]
estimated_chapters = 12
status = "proposed"
description = "Control atoms and light coherently: atomic fine and hyperfine structure, semiclassical and quantized light-matter coupling, Rabi dynamics and optical Bloch equations, spontaneous emission and cavity QED, laser cooling and trapping, degenerate quantum gases, molecular structure, precision spectroscopy, frequency combs, and ultrafast dynamics."

[[decks]]
id = "particle-physics-and-the-standard-model"
order = 30
tier = "specialization"
level = "graduate"
prerequisites = ["quantum-field-theory", "nuclear-and-particle-physics"]
recommended_after = ["electronics-and-instrumentation", "statistical-physics"]
estimated_chapters = 11
status = "proposed"
description = "Derive and test the Standard Model: non-abelian gauge structure, QCD and asymptotic freedom, electroweak unification and the Higgs mechanism, flavor mixing and CP violation, neutrino mass and oscillation, hadron-collider cross sections and parton distributions, detector response, and the leading beyond-Standard-Model extensions."

[[decks]]
id = "relativistic-astrophysics-and-cosmology"
order = 31
tier = "specialization"
level = "graduate"
prerequisites = ["general-relativity", "astrophysics-and-cosmology", "statistical-physics"]
recommended_after = ["quantum-field-theory", "computational-physics"]
estimated_chapters = 12
status = "proposed"
description = "Apply general relativity to the universe: black-hole spacetimes and horizon thermodynamics, gravitational-wave generation and compact binaries, relativistic accretion and jets, FLRW dynamics and thermal history, nucleosynthesis, CMB anisotropy and the Boltzmann hierarchy, inflation and primordial perturbations, and structure formation."

[[decks]]
id = "plasma-physics"
order = 32
tier = "specialization"
level = "graduate"
prerequisites = ["electromagnetic-theory", "continuum-mechanics-and-fluid-dynamics", "thermodynamics-and-statistical-mechanics"]
recommended_after = ["statistical-physics", "computational-physics", "astrophysics-and-cosmology"]
estimated_chapters = 11
status = "proposed"
description = "Model ionized matter across regimes: Debye shielding and plasma parameters, single-particle drifts and adiabatic invariants, the Vlasov and Fokker-Planck descriptions, two-fluid and MHD models, plasma waves and Landau damping, instabilities and reconnection, transport and collisions, and confinement in laboratory, space, and astrophysical settings."

[[decks]]
id = "soft-matter-and-complex-fluids"
order = 33
tier = "specialization"
level = "graduate"
prerequisites = ["statistical-physics", "continuum-mechanics-and-fluid-dynamics"]
recommended_after = ["computational-physics", "condensed-matter-and-solid-state-physics"]
estimated_chapters = 10
status = "proposed"
description = "Explain materials governed by thermal energy and entropy: Brownian motion and diffusion, entropic and depletion forces, polymer statistics and scaling, colloidal interactions and stability, amphiphilic self-assembly, liquid-crystal order, interfaces and wetting, viscoelasticity and rheology, and granular jamming and active matter."

[[decks]]
id = "biological-physics"
order = 34
tier = "specialization"
level = "graduate"
prerequisites = ["statistical-physics"]
recommended_after = ["soft-matter-and-complex-fluids", "biology/cell-biology", "mathematics/stochastic-processes"]
estimated_chapters = 11
status = "proposed"
description = "Apply physical reasoning to living systems: the scales and energy budget of the cell, diffusion and low-Reynolds-number transport, macromolecular conformation and folding energetics, molecular motors and free-energy transduction, membrane mechanics, stochastic gene expression, signaling and the physical limits of sensing, neural excitability, collective behavior, and evolutionary dynamics."

[[decks]]
id = "physics-research-practice"
order = 35
tier = "core"
level = "graduate"
prerequisites = ["measurement-uncertainty-and-experimental-physics", "computational-physics"]
recommended_after = ["electronics-and-instrumentation", "statistical-physics"]
estimated_chapters = 10
status = "proposed"
description = "Work the way researchers work: read and situate preprints and papers, design an investigation around a falsifiable claim, handle systematic uncertainty, blinding, and the look-elsewhere effect, build reproducible computational pipelines, apply the reproducibility and replicability distinction, and meet professional standards for authorship, peer review, conflict of interest, data retention, and safety."

# ---------------------------------------------------------------------------
# Research specialization: seven representative literature-facing branches.
# Each depends on its graduate branch theory AND on physics-research-practice,
# so no route reaches the literature without a research-method layer.
# ---------------------------------------------------------------------------

[[decks]]
id = "quantum-matter-and-materials-research"
order = 36
tier = "specialization"
level = "research-specialization"
prerequisites = ["condensed-matter-theory", "physics-research-practice"]
recommended_after = ["quantum-information-and-computation", "soft-matter-and-complex-fluids"]
estimated_chapters = 9
status = "proposed"
description = "Enter the literature on correlated and topological materials: symmetry-indicated band topology, unconventional and high-temperature superconductivity, moire and two-dimensional systems, quantum magnetism and spin liquids, materials synthesis and characterization claims, and what spectroscopic and transport evidence can actually establish."

[[decks]]
id = "quantum-computing-and-simulation-research"
order = 37
tier = "specialization"
level = "research-specialization"
prerequisites = ["quantum-information-and-computation", "physics-research-practice"]
recommended_after = ["atomic-molecular-and-optical-physics", "condensed-matter-theory"]
estimated_chapters = 9
status = "proposed"
description = "Read and critique quantum-computing research: benchmarking and randomized characterization, error budgets and threshold claims, surface and LDPC codes toward fault tolerance, analog and digital quantum simulation, classical-simulability arguments, and how to evaluate a quantum-advantage claim."

[[decks]]
id = "precision-measurement-and-quantum-sensing"
order = 38
tier = "specialization"
level = "research-specialization"
prerequisites = ["atomic-molecular-and-optical-physics", "physics-research-practice"]
recommended_after = ["quantum-information-and-computation", "electronics-and-instrumentation"]
estimated_chapters = 8
status = "proposed"
description = "Push measurement to its limits: the constant-based SI and its realization, optical clocks and comparisons, interferometric and atomic sensors, standard quantum limit and squeezing, noise budgets and systematic shifts, and searches for new physics through precision tests of fundamental constants and symmetries."

[[decks]]
id = "gravitational-wave-and-multimessenger-astrophysics"
order = 39
tier = "specialization"
level = "research-specialization"
prerequisites = ["relativistic-astrophysics-and-cosmology", "physics-research-practice"]
recommended_after = ["precision-measurement-and-quantum-sensing", "mathematics/mathematics-of-machine-learning-and-data-science"]
estimated_chapters = 9
status = "proposed"
description = "Work with transient and multimessenger evidence: interferometric detector response and noise, post-Newtonian and numerical-relativity waveform models, matched filtering and Bayesian parameter estimation, population inference and selection effects, electromagnetic and neutrino counterparts, and cosmological and nuclear inferences drawn from compact-binary events."

[[decks]]
id = "collider-and-precision-frontier-particle-physics"
order = 40
tier = "specialization"
level = "research-specialization"
prerequisites = ["particle-physics-and-the-standard-model", "physics-research-practice"]
recommended_after = ["electronics-and-instrumentation", "gravitational-wave-and-multimessenger-astrophysics"]
estimated_chapters = 9
status = "proposed"
description = "Follow the experimental program of fundamental interactions: Higgs property measurements, precision electroweak and flavor tests, Monte Carlo simulation chains and detector unfolding, statistical discovery and exclusion practice, direct and indirect dark-matter searches, and the neutrino-mass and rare-process frontier."

[[decks]]
id = "living-and-active-matter-research"
order = 41
tier = "specialization"
level = "research-specialization"
prerequisites = ["biological-physics", "physics-research-practice"]
recommended_after = ["soft-matter-and-complex-fluids", "biology/systems-and-quantitative-biology"]
estimated_chapters = 8
status = "proposed"
description = "Enter the physics-of-life literature: active-matter hydrodynamics and collective motion, cytoskeletal and tissue mechanics, nonequilibrium thermodynamics of biological energy use, information and inference limits in cellular decision-making, quantitative imaging and single-molecule evidence, and the standards a physical model of a living system must meet."

[[decks]]
id = "fusion-and-high-energy-density-science"
order = 42
tier = "specialization"
level = "research-specialization"
prerequisites = ["plasma-physics", "physics-research-practice"]
recommended_after = ["mathematics/numerical-methods-for-differential-equations"]
estimated_chapters = 9
status = "proposed"
description = "Evaluate the fusion and high-energy-density literature: magnetic-confinement equilibrium, stability, and transport, tokamak and stellarator operating limits, inertial-confinement implosion physics and ignition criteria, equations of state and opacity at extreme conditions, diagnostics under extreme flux, and how energy-gain claims are defined and verified."

# ---------------------------------------------------------------------------
# Coverage matrix. Domains are drawn from APS PhySH disciplines and research
# areas, the arXiv taxonomy, NSF PHY program areas, and the domain guide's
# whole-field checklist. Every material domain is included, deliberately
# deferred as a visible extension point, or explicitly out of scope.
# ---------------------------------------------------------------------------

[[coverage]]
domain = "measurement-units-and-physical-reasoning"
disposition = "included"
decks = ["measurement-and-physical-reasoning", "measurement-uncertainty-and-experimental-physics"]
rationale = "First contact must begin with observable comparison, units, scale, and uncertainty rather than force or energy, because a cold-start learner has no physics vocabulary at all."

[[coverage]]
domain = "classical-mechanics"
disposition = "included"
decks = ["motion-forces-and-energy", "classical-mechanics"]
rationale = "Split by mathematical maturity rather than topic: the foundational deck establishes the physical vocabulary algebraically, the undergraduate deck rebuilds it with calculus and vectors."

[[coverage]]
domain = "analytical-and-hamiltonian-mechanics"
disposition = "included"
decks = ["analytical-mechanics"]
rationale = "Variational and Hamiltonian structure is the machinery that quantum field theory and general relativity actually reuse, so it is a separate deck rather than trailing chapters of classical mechanics."

[[coverage]]
domain = "continuum-mechanics-and-elasticity"
disposition = "included"
decks = ["continuum-mechanics-and-fluid-dynamics"]
rationale = "Stress, strain, and elasticity share a spine with fluid mechanics and are the prerequisite grammar for soft matter and geophysical applications."

[[coverage]]
domain = "fluid-dynamics"
disposition = "included"
decks = ["continuum-mechanics-and-fluid-dynamics"]
rationale = "PhySH lists more second-level research areas under Fluid Dynamics than under Nuclear and Particles and Fields combined, and fluids sits inside published graduate classical-mechanics core syllabi; a single passing chapter would misrepresent the field."

[[coverage]]
domain = "nonlinear-dynamics-and-chaos"
disposition = "included"
decks = ["analytical-mechanics", "continuum-mechanics-and-fluid-dynamics"]
rationale = "The general theory of phase portraits, bifurcation, and chaos is supplied by mathematics/dynamical-systems-and-ergodic-theory and is referenced as recommended preparation; these decks own only the physical instances, namely Hamiltonian chaos and the transition to turbulence."

[[coverage]]
domain = "oscillations-and-waves"
disposition = "included"
decks = ["waves-sound-and-light", "classical-mechanics"]
rationale = "Wave phenomena are named as a fundamental area by the IOP accreditation framework and are the shared representational grammar for optics, quantum mechanics, and field theory."

[[coverage]]
domain = "acoustics"
disposition = "included"
decks = ["waves-sound-and-light"]
rationale = "Sound is covered as the accessible instance of wave propagation. Research-level acoustics, an APS division in its own right, is deferred with the other applied branches."

[[coverage]]
domain = "geometrical-and-physical-optics"
disposition = "included"
decks = ["waves-sound-and-light", "optics-and-photonics"]
rationale = "Ray and image reasoning belongs at the foundational level; coherence, Fourier diffraction, and polarization require the electromagnetic field description."

[[coverage]]
domain = "photonics-lasers-and-laser-science"
disposition = "included"
decks = ["optics-and-photonics", "atomic-molecular-and-optical-physics"]
